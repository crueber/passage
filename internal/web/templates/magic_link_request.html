{{define "magic_link_request.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in with magic link — Passage</title>
  <link rel="stylesheet" href="/static/passage.css">
</head>
<body>
<main class="auth-shell">
  <a href="/" class="wordmark text-xl">{{template "logo"}}<span>passage</span></a>

  <div class="w-full max-w-md">{{template "flash" .}}</div>

  <div class="auth-card">
    <h1 class="auth-title">Sign in with a magic link</h1>
    <p class="auth-sub">Enter your email and we&rsquo;ll send you a one-time sign-in link.</p>

    <form method="POST" action="/login/magic" class="mt-5 space-y-4">
      <input type="hidden" name="rd" value="{{.RedirectTo}}">
      {{csrfField .CSRFToken}}

      <div>
        <label class="label" for="email">Email address</label>
        <input class="input" type="email" id="email" name="email"
               autocomplete="email" required autofocus value="{{.Email}}">
      </div>

      <button type="submit" class="btn btn-primary w-full">{{template "ic-mail"}}Send sign-in link</button>
    </form>

    <p class="auth-alt"><a href="/login">Back to sign in</a></p>
  </div>
</main>
</body>
</html>
{{end}}
