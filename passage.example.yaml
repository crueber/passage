# passage.example.yaml — copy to passage.yaml and edit for your environment
#
# This file is bootstrap-only: where the server listens, the public URL, the
# database location, key material and logging. Everything else — sign-in
# methods, registration, sessions, branding, email, rate limits, the security
# webhook, metrics, themes and upstream identity providers — is configured in
# the admin UI (Settings) and stored in the database.

server:
  host: "0.0.0.0"
  port: 8080
  # Required — used for email links, WebAuthn, and OIDC discovery.
  # Must match the public URL that clients use to reach Passage.
  base_url: "https://auth.home.example.com"

database:
  path: "./passage.db"

session:
  # Cookie settings describe how the deployment is reached; everything else
  # about sessions lives in Settings → General.
  cookie_name: "passage_session"
  cookie_secure: true   # set false only for local HTTP development

security:
  # AES-256-GCM key for TOTP secrets at rest, as 64 hex characters or the
  # base64 encoding of 32 bytes (`openssl rand -hex 32`). Optional: when empty,
  # a key file named <database.path>.key is created next to the database on
  # first use with mode 0600. The key must stay stable across restarts —
  # without it, enrolled TOTP secrets cannot be read and each affected user
  # needs an admin MFA reset. The key file is as sensitive as the database.
  encryption_key: ""

csrf:
  # Optional server-side CSRF signing secret (64+ hex characters). Empty means
  # an ephemeral key is generated at startup: anonymous CSRF tokens still work,
  # but are not valid across restarts.
  key: ""

log:
  level: "info"    # "debug" | "info" | "warn" | "error"
  format: "json"   # "json" | "text"

auth:
  # Upstream OIDC/OAuth identity providers. Each entry adds a sign-in button to
  # the login page and uses authorization-code flow with state, nonce, and PKCE
  # (S256). The provider's id_token is verified against its JWKS (RS256 only),
  # issuer, audience, expiry, and nonce.
  #
  # This list is the one feature still configured here; provider management
  # moves into the admin UI next.
  providers: []
  # providers:
  #   - name: "authentik"     # unique slug used in /login/oidc/{name}
  #     label: "Authentik"
  #     issuer: "https://auth.example.com/application/o/passage/"
  #     client_id: "passage"
  #     client_secret: "secret"
  #     scopes: ["openid", "email", "profile"]
  #     auto_create: false    # create a local account on first sign-in
