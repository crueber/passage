# passage.example.yaml — copy to passage.yaml and edit for your environment

server:
  host: "0.0.0.0"
  port: 8080
  # Required — used for email links, WebAuthn, and OIDC discovery.
  # Must match the public URL that clients use to reach Passage.
  base_url: "https://auth.home.example.com"

database:
  path: "./passage.db"

session:
  duration_hours: 24
  # Optional idle timeout. A session that has not been used for this many
  # minutes is closed even if duration_hours has not elapsed. 0 disables it.
  # "Used" is refreshed at most once every five minutes per session.
  idle_timeout_minutes: 0
  cookie_name: "passage_session"
  cookie_secure: true

smtp:
  host: "smtp.example.com"
  port: 587
  username: "passage@example.com"
  password: "changeme"
  from: "Passage <passage@example.com>"
  tls: "starttls"

auth:
  allow_registration: true
  bcrypt_cost: 12
  # Per-account password-login throttling. After this many consecutive invalid
  # passwords the account is locked for lockout_minutes. Set either value to 0
  # to disable. Locks expire automatically; an admin can unlock early from the
  # Users page. Only password login participates — passkeys and magic links are
  # unaffected.
  max_login_failures: 5
  lockout_minutes: 15
  # Default for the "Require two-factor authentication" policy. When on, every
  # signed-in user must enrol an authenticator app (TOTP) before they can use
  # Passage; password sign-ins then ask for a 6-digit code. Passkeys and magic
  # links are not affected. The admin checkbox in Settings → Authentication
  # methods overrides this value once saved.
  require_mfa: false

security:
  # AES-256-GCM key for TOTP secrets at rest, as 64 hex characters or the
  # base64 encoding of 32 bytes (`openssl rand -hex 32`). Optional: when empty,
  # a key file named <database.path>.key is created next to the database on
  # first use with mode 0600. The key must stay stable across restarts —
  # without it, enrolled TOTP secrets cannot be read and each affected user
  # needs an admin MFA reset. The key file is as sensitive as the database.
  encryption_key: ""
  # POST every authentication event to this endpoint as JSON.
  # Empty disables the webhook. Delivery is asynchronous and at-most-once:
  # a slow or dead endpoint never delays or fails a login.
  webhook_url: ""
  # Optional. When set, each request body is signed with HMAC-SHA256 and the
  # digest is sent as X-Passage-Signature: sha256=<hex>.
  webhook_secret: ""
  # Per-request delivery timeout in seconds (1–60).
  webhook_timeout_seconds: 5

log:
  level: "info"
  format: "json"

ui:
  # Default colour theme for the web UI. Applies server-side to every page;
  # individual admins can pick a per-browser override in Settings > Appearance
  # (stored in localStorage, cosmetic only).
  # Valid: slate, nord, gruvbox, solarized, catppuccin, tokyo-night,
  #        rose-pine, everforest, kanagawa, paper
  theme: "slate"
